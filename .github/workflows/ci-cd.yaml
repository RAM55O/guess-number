name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-scan:
    name: Test, SonarQube & Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies & Run Tests with Coverage
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          PYTHONPATH=. pytest --cov=. --cov-report=xml --cov-report=term tests/

      - name: SonarQube Code Analysis
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || secrets.SONAR_HOST_UR }}

      - name: Trivy Repo Scan (FS & Secrets)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  build-and-push:
    name: Build, Docker Scan & Push
    needs: test-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker Image Name
        id: image-meta
        run: |
          # Convert Docker Hub username to lowercase for valid Docker repository tag
          RAW_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          DOCKER_USER=$(echo "${RAW_USER}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${DOCKER_USER}/guess-number" >> $GITHUB_OUTPUT
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build Docker Image locally
        run: |
          docker build -t ${{ steps.image-meta.outputs.image_name }}:${{ steps.image-meta.outputs.tag }} .

      - name: Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image-meta.outputs.image_name }}:${{ steps.image-meta.outputs.tag }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image
        run: |
          docker push ${{ steps.image-meta.outputs.image_name }}:${{ steps.image-meta.outputs.tag }}
          docker tag ${{ steps.image-meta.outputs.image_name }}:${{ steps.image-meta.outputs.tag }} ${{ steps.image-meta.outputs.image_name }}:latest
          docker push ${{ steps.image-meta.outputs.image_name }}:latest

      - name: Update Helm values.yaml with new Image Tag & Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Preserve YAML indentation when updating tag and repository
          sed -i 's|^\([[:space:]]*repository:\).*|\1 '${{ steps.image-meta.outputs.image_name }}'|' guess/values.yaml
          sed -i 's|^\([[:space:]]*tag:\).*|\1 "${{ steps.image-meta.outputs.tag }}"|' guess/values.yaml
          
          git add guess/values.yaml
          git commit -m "chore(ci): update image to ${{ steps.image-meta.outputs.image_name }}:${{ steps.image-meta.outputs.tag }} [skip ci]" || exit 0
          git push
